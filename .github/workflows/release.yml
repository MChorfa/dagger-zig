name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  release-please:
    name: Release Please
    needs: detect-release
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.2.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

  build-and-attest:
    name: Build & Attest
    needs: [detect-release, release-please]
    if: |
      github.repository == 'MChorfa/dagger-zig' &&
      (needs.detect-release.outputs.should_build == 'true' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}

      - name: Run Dagger build pipeline
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: ./ci/pipeline
          args: build --arg-0=. --arg-1=${{ needs.detect-release.outputs.tag_name || needs.release-please.outputs.tag_name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: /tmp/dagger-artifacts/build/
          retention-days: 30

  sbom-and-sign:
    name: SBOM & Sign
    needs: [detect-release, release-please, build-and-attest]
    if: |
      github.repository == 'MChorfa/dagger-zig' &&
      (needs.detect-release.outputs.should_build == 'true' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign & upload release assets
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ needs.detect-release.outputs.tag_name || needs.release-please.outputs.tag_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
            artifacts/**/*.sbom.*
