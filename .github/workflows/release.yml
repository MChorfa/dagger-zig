name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  # Determine if this is a release-please or manual tag release
  detect-release:
    name: detect-release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Manual tag release detected: ${{ github.ref_name }}"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
          fi

  release-please:
    name: release-please
    needs: detect-release
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          # NOTE: If you get "GitHub Actions is not permitted to create or approve pull requests",
          # either:
          # 1. Enable in Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"
          # 2. Use a Personal Access Token: token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

  build-and-attest:
    name: build-and-attest
    needs: [ detect-release, release-please ]
    if: ${{ needs.detect-release.outputs.should_build == 'true' ||
      needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          [
            x86_64-linux-gnu,
            aarch64-linux-gnu,
            x86_64-macos-none,
            aarch64-macos-none,
          ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}

      - name: setup zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      - name: build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
        env:
          SOURCE_DATE_EPOCH: "1700000000"

      - name: package artifacts
        run: |
          mkdir -p dist
          # Package libraries, binaries, and headers
          tar -czf dist/dagger-zig-${{ matrix.target }}.tar.gz \
            -C zig-out \
            lib/ bin/ include/ 2>/dev/null || \
          tar -czf dist/dagger-zig-${{ matrix.target }}.tar.gz \
            -C zig-out \
            lib/ bin/ 2>/dev/null || \
          tar -czf dist/dagger-zig-${{ matrix.target }}.tar.gz \
            -C zig-out \
            lib/
          # Generate checksums
          cd dist && sha256sum dagger-zig-${{ matrix.target }}.tar.gz > dagger-zig-${{ matrix.target }}.tar.gz.sha256

      - name: upload artifact
        uses: actions/upload-artifact@4cec6d1c0373796067e7a92d81eb8e3c1015c31c # v4.6.1
        with:
          name: build-${{ matrix.target }}
          path: dist/

      - name: attest build provenance
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: dist/*
          push-to-registry: false

  sbom-and-sign:
    name: sbom-and-sign
    needs: [ detect-release, release-please, build-and-attest ]
    if: ${{ needs.detect-release.outputs.should_build == 'true' ||
      needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}

      - name: download artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts
          merge-multiple: true

      - name: generate sbom
        uses: anchore/sbom-action@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: sign sbom
        run: |
          cosign sign-blob --yes --output-signature sbom.spdx.json.sig sbom.spdx.json

      - name: upload release assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}
          files: |
            sbom.spdx.json
            sbom.spdx.json.sig
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
