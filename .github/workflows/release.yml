name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_tag.outputs.should_build || steps.check_branch.outputs.should_build }}
      tag_name: ${{ steps.check_tag.outputs.tag_name }}
    steps:
      - id: check_tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$REF_NAME" >> "$GITHUB_OUTPUT"

      - id: check_branch
        if: ${{ github.ref_type != 'tag' }}
        run: echo "should_build=false" >> "$GITHUB_OUTPUT"

  release-please:
    name: Release Please
    needs: detect-release
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + tag
      pull-requests: write # open/maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

  build-and-attest:
    name: Build & Attest
    needs: [detect-release, release-please]
    if: |
      !cancelled() &&
      github.repository == 'MChorfa/dagger-zig' &&
      (needs.detect-release.outputs.should_build == 'true' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}

      - name: Run Dagger build pipeline
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "v0.21.7" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: build --arg-0=. --arg-1=${{ needs.detect-release.outputs.tag_name || needs.release-please.outputs.tag_name }} export --path=/tmp/dagger-artifacts/build

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-artifacts
          path: /tmp/dagger-artifacts/build/
          retention-days: 30

  sbom-and-sign:
    name: SBOM & Sign
    needs: [detect-release, release-please, build-and-attest]
    if: |
      !cancelled() &&
      github.repository == 'MChorfa/dagger-zig' &&
      (needs.detect-release.outputs.should_build == 'true' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload signed assets to the release
      id-token: write # keyless cosign + build provenance attestation
      attestations: write # actions/attest-build-provenance
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.detect-release.outputs.tag_name ||
            needs.release-please.outputs.tag_name }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: ./artifacts

      # The Dagger build produces per-target install dirs under builds/<target>/
      # and SBOMs under sbom/. Package each target into a release tarball with a
      # SHA-256 checksum so there is a concrete artifact to attest and sign.
      # Also emit an aggregate checksums file plus a release-manifest checksum
      # rooted in the SPDX SBOM so downstream consumers can verify the release
      # inventory and the SBOM anchor independently.
      - name: Package per-target tarballs + checksums
        env:
          TAG: ${{ needs.detect-release.outputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          for d in artifacts/builds/*/; do
            target="$(basename "$d")"
            tar -czf "dist/dagger-zig-${TAG}-${target}.tar.gz" -C "$d" .
          done
          cp artifacts/sbom/* dist/ 2>/dev/null || true
          (cd dist && sha256sum *.tar.gz > checksums.sha256)
          sha256sum dist/sbom.spdx.json | awk '{print $1}' > dist/release-manifest.sha256
          (cd dist && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
          ls -la dist

      # Base64-encoded sha256 subjects fed to the SLSA Build L3 generator below.
      - name: Generate subject hashes
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(cd dist && sha256sum *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      # SLSA build provenance (GitHub-native attestation) for each tarball.
      # Verify: gh attestation verify <file> --repo MChorfa/dagger-zig
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*.tar.gz"

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      # Keyless cosign signature (Sigstore bundle) for each tarball.
      # Verify: cosign verify-blob --bundle <file>.bundle \
      #   --certificate-identity 'https://github.com/MChorfa/dagger-zig/.github/workflows/release.yml@refs/tags/<TAG>' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>
      - name: Sign artifacts with cosign
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "${f}.bundle" "${f}"
          done
          cosign sign-blob --yes --bundle dist/release-manifest.sha256.bundle dist/release-manifest.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.detect-release.outputs.tag_name || needs.release-please.outputs.tag_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.bundle
            dist/checksums.sha256
            dist/release-manifest.sha256
            dist/release-manifest.sha256.bundle
            dist/sbom.*

  # SLSA Build Level 3 provenance via the certified slsa-github-generator
  # reusable workflow. It runs in an isolated, trusted context the build job
  # cannot influence (non-forgeable provenance), and attaches a signed
  # multiple.intoto.jsonl to the release. Must be pinned to a semver tag.
  # Verify: slsa-verifier verify-artifact <tarball> \
  #   --provenance-path multiple.intoto.jsonl \
  #   --source-uri github.com/MChorfa/dagger-zig --source-tag <tag>
  provenance:
    name: SLSA L3 Provenance
    needs: [detect-release, sbom-and-sign]
    if: ${{ !cancelled() && github.repository == 'MChorfa/dagger-zig' && needs.detect-release.outputs.should_build == 'true' }}
    permissions:
      actions: read # read the workflow path for provenance
      id-token: write # keyless signing of the provenance
      contents: write # attach provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sbom-and-sign.outputs.hashes }}
      upload-assets: true

  # Closes the loop: after publish, verify the L3 provenance, GitHub attestation,
  # and cosign signatures of every released tarball. Fails the run loudly if any
  # check fails, so a broken/unsigned release can't pass silently.
  verify-release:
    name: Verify Release
    needs: [detect-release, sbom-and-sign, provenance]
    if: ${{ !cancelled() && github.repository == 'MChorfa/dagger-zig' && needs.detect-release.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify release provenance + signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.detect-release.outputs.tag_name }}
        run: scripts/release-verify.sh "$TAG_NAME"
