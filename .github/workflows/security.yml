name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 9 AM UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    name: Security Scanning Pipeline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Dagger security pipeline
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "v0.21.0" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: security --arg-0=. export --path=/tmp/dagger-artifacts/security

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: /tmp/dagger-artifacts/security/
          retention-days: 30
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # CodeQL Analysis (skip for Zig-only repo, keep for CI scripts)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@63e4bdc93048c6d9800b99332842de18443db5b1 # v3.28.12
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@63e4bdc93048c6d9800b99332842de18443db5b1 # v3.28.12

  # Dependency vulnerability scanning (Grype - Anchore)
  grype:
    name: Grype Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v6.0.0
        id: scan
        with:
          path: "."
          severity-cutoff: "high"

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@63e4bdc93048c6d9800b99332842de18443db5b1 # v3.28.12
        if: steps.scan.outcome == 'success'
        with:
          sarif_file: "${{ steps.scan.outputs.sarif }}"

  # License compliance (optional - requires API key, continues on error)
  fossa:
    name: FOSSA License Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check FOSSA API Key
        id: check-key
        run: |
          if [ -z "${{ secrets.FOSSA_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "FOSSA_API_KEY not configured - skipping scan"
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Run FOSSA scan
        if: steps.check-key.outputs.has_key == 'true'
        uses: fossas/fossa-action@93a52ecf7c3ac7eb40f5de77fd69b1a19524de94 # v1.5.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
