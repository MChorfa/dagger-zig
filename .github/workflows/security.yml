name: Security Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 9 AM UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # SAST - Static Application Security Testing
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=auto \
            --config=security-audit \
            --config=zig \
            --json --output=semgrep-results.json \
            || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b8d3b2ac34412d594b6e79cc5c645b805de6d1a0 # v3.28.12
        if: always()
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload results
        uses: actions/upload-artifact@4cec6d1c0373796067e7a92d81eb8e3c1015c31c # v4.6.1
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

  # Secret scanning (optional - requires license, continues on error)
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@a8519626edf08f5e6179e62089a09f8f4c4995d0 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # CodeQL Analysis (Zig support limited, but good for CI scripts)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b8d3b2ac34412d594b6e79cc5c645b805de6d1a0 # v3.28.12
        with:
          languages: go
          queries: security-extended,security-and-quality

      # CodeQL needs to see the Go code that generates Zig
      - name: Autobuild
        uses: github/codeql-action/autobuild@b8d3b2ac34412d594b6e79cc5c645b805de6d1a0 # v3.28.12

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b8d3b2ac34412d594b6e79cc5c645b805de6d1a0 # v3.28.12
        with:
          category: "/language:go"

  # Dependency vulnerability scanning
  trivy:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6c175e9c4083f852c5bc8ddf6a1a7d8c9d53d84f # v0.30.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@b8d3b2ac34412d594b6e79cc5c645b805de6d1a0 # v3.28.12
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # License compliance (optional - requires API key, continues on error)
  fossa:
    name: FOSSA License Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run FOSSA scan
        uses: fossas/fossa-action@93f6aa31684f1ac80e87a5a26983ee01c3f2aa50 # v1.5.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
