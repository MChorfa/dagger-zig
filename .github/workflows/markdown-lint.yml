name: Documentation CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Documentation Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Dagger docs pipeline
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "v0.21.0" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: docs --arg-0=. export --path=/tmp/dagger-artifacts/docs

      - name: Upload docs artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: /tmp/dagger-artifacts/docs/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: docs-build
