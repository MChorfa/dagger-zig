name: Documentation CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Markdown linting with markdownlint-cli
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: markdownlint "**/*.md" --config .markdownlint.yaml || true

      - name: Check formatting with prettier
        run: |
          npm install -g prettier
          prettier --check "**/*.md" || true

  # Build documentation site with mdBook
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: "latest"

      - name: Build docs
        run: |
          cd docs
          mdbook build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  # Deploy to GitHub Pages (only on main)
  deploy:
    name: Deploy to GitHub Pages
    needs: [ lint, build-docs ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
