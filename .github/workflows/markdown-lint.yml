name: Documentation CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Markdown linting with markdownlint-cli
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: markdownlint "**/*.md" --config .markdownlint.yaml || true

      - name: Check formatting with prettier
        run: |
          npm install -g prettier
          prettier --check "**/*.md" || true

  # Build documentation site with mdBook
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@7a5bc2f71210679134f0478076af50eb671df97f # v2.0.2
        with:
          mdbook-version: "latest"

      - name: Build docs
        run: |
          cd docs
          mdbook build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56f8e96462530ca6231a68dc51eb8f3a09d8e2da # v3.0.1
        with:
          path: docs/_site

  # Deploy to GitHub Pages (only on main)
  deploy:
    name: Deploy to GitHub Pages
    needs: [ lint, build-docs ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164e0738a906b54c9a1be986af57c2f9fa # v4.0.5
