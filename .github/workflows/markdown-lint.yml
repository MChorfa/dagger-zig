name: Documentation CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Documentation linting via the root Dagger module
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run docs checks with the root Dagger module
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "v0.21.0"
          verb: call
          module: .
          args: lint-docs --arg-0=. export --path ./reports

      - name: Upload docs check reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: docs-check-reports
          path: reports/

  # Documentation site build via the root Dagger module
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build docs with the root Dagger module
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "v0.21.0"
          verb: call
          module: .
          args: build-docs --arg-0=. export --path ./docs-site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs-site

  # Deploy to GitHub Pages (only on main)
  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, build-docs]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
