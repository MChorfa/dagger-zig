name: Documentation CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "docs/**"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Documentation Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dagger docs pipeline
        uses: dagger/dagger-for-github@v8.4.0
        with:
          verb: call
          module: ./ci/pipeline
          args: docs --arg-0=.

      - name: Upload docs artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: /tmp/dagger-artifacts/docs/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: docs-build
