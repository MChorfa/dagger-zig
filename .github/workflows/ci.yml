name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  # Build and test via Dagger (containerized execution)
  build:
    name: Build & Test via Dagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh
          dagger version

      - name: Lint (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig fmt --check src/
          '
        continue-on-error: true

      - name: Build (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build
          '

      - name: Test (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build test
          '
        continue-on-error: true
