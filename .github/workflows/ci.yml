name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  # All CI runs through Dagger - single source of truth
  dagger:
    name: Dagger CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh
          dagger version

      - name: Run Dagger Lint
        run: dagger call -m ci lint --source=.

      - name: Run Dagger Tests
        run: dagger call -m ci run-tests --source=.

      - name: Run Dagger Full Pipeline (optional)
        run: dagger call -m ci full-pipeline --source=.
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        continue-on-error: true
