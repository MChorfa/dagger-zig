name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  # Thin orchestration layer — delegates to Dagger for all build/test/lint
  pipeline:
    name: CI Pipeline (via Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dagger
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: latest

      - name: Run CI pipeline
        run: dagger call -m ./ci/pipeline run --arg-0 .
