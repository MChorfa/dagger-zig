name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard Analysis Pipeline
    if: github.repository == 'MChorfa/dagger-zig'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Dagger compliance pipeline (scorecard)
        uses: dagger/dagger-for-github@v8.4.0
        with:
          verb: call
          module: ./ci/pipeline
          args: compliance --arg-0=. --arg-1=https://github.com/${{ github.repository }} --arg-2=${{ github.ref_name }} --arg-3=${{ github.repository_is_fork }}

      - name: Upload scorecard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: /tmp/dagger-artifacts/compliance/
          retention-days: 90

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3.28.12
        with:
          sarif_file: /tmp/dagger-artifacts/compliance/scorecard.json
