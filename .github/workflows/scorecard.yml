name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard Analysis Pipeline
    if: github.repository == 'MChorfa/dagger-zig'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Run Dagger compliance pipeline (scorecard)
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        env:
          REPO_URL: https://github.com/${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          IS_FORK: ${{ github.event.repository.fork }}
        with:
          version: "v0.21.7" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: compliance --arg-0=. --arg-1=${{ env.REPO_URL }} --arg-2=${{ env.BRANCH_NAME }} --arg-3=${{ env.IS_FORK }} export --path=/tmp/dagger-artifacts/compliance

      - name: Upload scorecard results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scorecard-results
          path: /tmp/dagger-artifacts/compliance/
          retention-days: 90

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@63e4bdc93048c6d9800b99332842de18443db5b1 # v3.28.12
        with:
          sarif_file: /tmp/dagger-artifacts/compliance/scorecard.sarif
