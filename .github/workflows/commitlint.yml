name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Dagger compliance pipeline (commitlint)
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: ./ci/pipeline
          args: compliance --arg-0=. --arg-1=https://github.com/${{ github.repository }} --arg-2=${{ github.ref_name }} --arg-3=${{ github.repository_is_fork }}

      - name: Upload commitlint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitlint-results
          path: /tmp/dagger-artifacts/compliance/commitlint*
          retention-days: 7
