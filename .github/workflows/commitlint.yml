name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Run Dagger compliance pipeline (commitlint)
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        env:
          REPO_URL: https://github.com/${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          IS_FORK: ${{ github.event.repository.fork }}
        with:
          version: "v0.21.0" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: compliance --arg-0=. --arg-1=${{ env.REPO_URL }} --arg-2=${{ env.BRANCH_NAME }} --arg-3=${{ env.IS_FORK }} export --path=/tmp/dagger-artifacts/compliance

      - name: Upload commitlint results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: commitlint-results
          path: /tmp/dagger-artifacts/compliance/commitlint*
          retention-days: 7
