name: conformance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Conformance testing via Dagger (containerized execution)
  conformance:
    name: Conformance via Dagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Verify SDK builds (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build
          '

      - name: Verify tests compile (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build test
          '
        continue-on-error: true
