name: conformance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # All conformance testing through Dagger
  conformance:
    name: Dagger Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Schema Conformance via Dagger
        run: dagger call -m ci schema-conformance --source=.
        continue-on-error: true

      - name: Core Types Conformance via Dagger
        run: dagger call -m ci conformance --source=. --category=core_types
        continue-on-error: true
