name: conformance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  conformance:
    name: Conformance Tests Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dagger test pipeline
        uses: dagger/dagger-for-github@v8.4.0
        with:
          verb: call
          module: ./ci/pipeline
          args: test --arg-0=.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/dagger-artifacts/test/
          retention-days: 30
