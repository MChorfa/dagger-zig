name: conformance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Schema validation (placeholder - runs zig build to verify code compiles)
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@2a1ab1b0e50edf7ebfdf94d8fd43b6e345b5c6d3 # v2.2.1
        with:
          version: 0.16.0

      - name: Verify SDK builds
        run: zig build

      - name: Verify tests compile
        run: zig build test

  # Optional Dagger-based conformance (requires Dagger Cloud)
  dagger-conformance:
    name: Dagger Conformance (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Schema Validation via Dagger
        run: dagger call -m ci schema-conformance --source=.
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        continue-on-error: true

      - name: Core Types Conformance via Dagger
        run: dagger call -m ci conformance --source=. --category=core_types
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        continue-on-error: true

  summary:
    name: Conformance Summary
    runs-on: ubuntu-latest
    needs: [ schema, dagger-conformance ]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## Conformance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Validation (Zig Build) | ${{ needs.schema.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dagger Conformance (Optional) | ${{ needs.dagger-conformance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Only fail if the core schema validation fails
          if [ "${{ needs.schema.result }}" != "success" ]; then
            echo "❌ Core conformance tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Core conformance tests passed" >> $GITHUB_STEP_SUMMARY
          fi
