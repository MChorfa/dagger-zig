name: conformance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schema Validation
        uses: dagger/dagger-for-github@v5
        with:
          version: "0.11"
          args: call -m ci schema-conformance --source=.
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: schema-reports
          path: |
            conformance-reports/
          if-no-files-found: warn

  core-types:
    name: Core Types Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core Types Validation
        uses: dagger/dagger-for-github@v5
        with:
          version: "0.11"
          args: call -m ci conformance --source=. --category=core_types
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  container-api:
    name: Container API Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Container API Validation
        uses: dagger/dagger-for-github@v5
        with:
          version: "0.11"
          args: call -m ci conformance --source=. --category=container_api
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  directory-api:
    name: Directory API Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Directory API Validation
        uses: dagger/dagger-for-github@v5
        with:
          version: "0.11"
          args: call -m ci conformance --source=. --category=directory_api
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  summary:
    name: Conformance Summary
    runs-on: ubuntu-latest
    needs: [schema, core-types, container-api, directory-api]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## Conformance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Validation | ${{ needs.schema.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core Types | ${{ needs.core-types.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container API | ${{ needs.container-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Directory API | ${{ needs.directory-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.schema.result }}" != "success" ] || \
             [ "${{ needs.core-types.result }}" != "success" ] || \
             [ "${{ needs.container-api.result }}" != "success" ] || \
             [ "${{ needs.directory-api.result }}" != "success" ]; then
            echo "⚠️ Some conformance tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All conformance tests passed" >> $GITHUB_STEP_SUMMARY
          fi
