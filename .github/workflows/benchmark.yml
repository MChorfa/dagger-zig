name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Benchmarks via Dagger (containerized execution)
  benchmark:
    name: Benchmarks via Dagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Run Benchmarks (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build bench 2>&1
          ' | tee benchmark-results.txt
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.txt
