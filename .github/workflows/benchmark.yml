name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # All benchmarks through Dagger
  benchmark:
    name: Dagger Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Run Benchmarks via Dagger
        run: |
          # Run benchmarks inside Dagger container with proper Zig setup
          dagger call -m ci run-tests --source=. -- 2>&1 | tee benchmark-results.txt
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.txt
