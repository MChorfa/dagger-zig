name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Performance Benchmarks Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Dagger benchmark pipeline
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "v0.21.0" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: test --arg-0=. export --path=/tmp/dagger-artifacts/test

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: /tmp/dagger-artifacts/test/benchmarks/
          retention-days: 30
