name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Performance Benchmarks Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dagger benchmark pipeline
        uses: dagger/dagger-for-github@v6
        with:
          verb: call
          module: ./ci/pipeline
          args: test --arg-0=.

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/dagger-artifacts/test/benchmarks/
          retention-days: 30
