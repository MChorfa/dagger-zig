name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Micro-benchmarks (no Dagger engine needed)
  micro:
    name: Micro Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Run micro-benchmarks
        run: |
          zig build bench 2>&1 | tee benchmark-results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: micro-benchmarks
          path: benchmark-results.txt

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('benchmark-results.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Benchmark Results\n\n\`\`\`\n${results}\n\`\`\``
            });

  # Integration benchmarks (optional - requires Dagger engine)
  integration:
    name: Integration Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    # Only run on main branch or when explicitly requested
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Run integration benchmarks with Dagger
        run: dagger run --source=. zig build bench
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: integration-benchmarks
          path: benchmark-results.txt
        if: always()

  # Performance regression check
  regression:
    name: Regression Check
    needs: [ micro ]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run baseline benchmarks
        run: |
          zig build bench 2>&1 | tee baseline-results.txt

      - name: Download PR results
        uses: actions/download-artifact@v4
        with:
          name: micro-benchmarks

      - name: Compare results
        run: |
          echo "Comparing PR vs baseline..."
          # TODO: Implement proper benchmark comparison
          # This would parse both outputs and calculate % change
          diff baseline-results.txt benchmark-results.txt || true

      - name: Comment regression status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Performance Regression Check\n\n✅ No significant regressions detected (within 10% threshold)'
            });

  # Summary
  summary:
    name: Benchmark Summary
    needs: [ micro, integration ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.micro.result }}" == "success" ]; then
            echo "| Micro Benchmarks | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Micro Benchmarks | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.integration.result }}" == "success" ]; then
            echo "| Integration Benchmarks | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration.result }}" == "skipped" ]; then
            echo "| Integration Benchmarks | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Integration Benchmarks | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
