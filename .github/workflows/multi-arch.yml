name: Multi-Architecture Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Multi-Arch Build Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dagger build pipeline
        uses: dagger/dagger-for-github@v8.4.0
        with:
          verb: call
          module: ./ci/pipeline
          args: build --arg-0=. --arg-1=multi-arch

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-arch-builds
          path: /tmp/dagger-artifacts/build/
          retention-days: 30
