name: Multi-Architecture Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Linux builds via Dagger (cross-compilation in containers)
  linux:
    name: Linux Cross-Builds via Dagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dagger
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Build Linux x86_64 (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe
          '
        continue-on-error: true

      - name: Build Linux ARM64 (via Dagger)
        run: |
          dagger run --source=. sh -c '
            cd /src &&
            apk add --no-cache zig &&
            zig build -Dtarget=aarch64-linux-gnu -Doptimize=ReleaseSafe
          '
        continue-on-error: true

  # macOS builds on native runners (Dagger doesn't support macOS containers)
  macos:
    name: macOS Native Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      - name: Build macOS (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: build-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 30

  # Summary
  summary:
    name: Build Summary
    needs: [ linux, macos ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Multi-Architecture Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Method |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux (x86_64, ARM64) | Dagger cross-build |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS (x86_64, ARM64) | Native Zig |" >> $GITHUB_STEP_SUMMARY
