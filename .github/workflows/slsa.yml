name: SLSA Provenance & Sigstore Signing

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read
  security-events: write

jobs:
  slsa:
    name: SLSA & Sign Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dagger compliance pipeline (SLSA)
        uses: dagger/dagger-for-github@v8.4.0
        with:
          verb: call
          module: ./ci/pipeline
          args: compliance --arg-0=. --arg-1=https://github.com/${{ github.repository }} --arg-2=${{ github.ref_name }} --arg-3=${{ github.repository_is_fork }}

      - name: Upload SLSA & compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slsa-compliance
          path: /tmp/dagger-artifacts/compliance/
          retention-days: 90
