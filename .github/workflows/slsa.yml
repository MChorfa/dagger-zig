name: Compliance Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    name: Compliance Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Dagger compliance pipeline
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "v0.21.0" # match ci/pipeline/dagger.json engineVersion
          verb: call
          module: ./ci/pipeline
          args: compliance --arg-0=. --arg-1=https://github.com/${{ github.repository }} --arg-2=${{ github.ref_name }} --arg-3=${{ github.event.repository.fork }} export --path=/tmp/dagger-artifacts/compliance

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compliance
          path: /tmp/dagger-artifacts/compliance/
          retention-days: 90
