name: SLSA Provenance & Sigstore Signing

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # Needed for release uploads
  id-token: write # Needed for Sigstore keyless signing
  actions: read

jobs:
  # Build artifacts and generate SLSA provenance
  build:
    name: Build & Generate Provenance
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      - name: Build SDK
        run: zig build -Doptimize=ReleaseSafe

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p artifacts
          # Copy any built artifacts (lib, bin, or none for pure library)
          cp zig-out/lib/* artifacts/ 2>/dev/null || true
          cp zig-out/bin/* artifacts/ 2>/dev/null || true
          # List what we found
          ls -la artifacts/

      - name: Generate hashes
        id: hash
        if: steps.collect.outputs.has_artifacts != 'false'
        run: |
          cd artifacts
          if [ -z "$(ls -A)" ]; then
            echo "No artifacts to hash - this is a library SDK with no binaries"
            echo "hashes=" >> $GITHUB_OUTPUT
          else
            sha256sum * > ../hashes.txt
            echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: build-artifacts
          path: artifacts/
          retention-days: 30

  # SLSA Level 4 provenance generator (reusable workflow)
  provenance:
    name: Generate SLSA Provenance
    needs: [ build ]
    # Skip on forks and PRs (OIDC requires main repo), and if no artifacts
    if: |
      github.repository == 'MChorfa/dagger-zig' && 
      github.event_name != 'pull_request' &&
      needs.build.outputs.hashes != ''
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      provenance-name: "dagger-zig.intoto.jsonl"
      upload-assets: true

  # Sigstore keyless signing
  sign:
    name: Sign with Sigstore
    needs: [ build, provenance ]
    if: |
      github.repository == 'MChorfa/dagger-zig' && 
      github.event_name != 'pull_request' &&
      needs.build.outputs.hashes != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Sigstore OIDC
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.1.9
        with:
          name: build-artifacts
          path: artifacts/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign artifacts with Sigstore
        run: |
          cd artifacts
          for file in *; do
            cosign sign-blob \
              --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.cert" \
              "${file}"
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4.6.1
        with:
          name: signatures
          path: artifacts/*.sig
          retention-days: 90

      - name: Upload certificates
        uses: actions/upload-artifact@v4.6.1
        with:
          name: certificates
          path: artifacts/*.cert
          retention-days: 90

  # SBOM generation
  sbom:
    name: Generate SBOM
    # Skip on forks (SBOM action may need permissions)
    if: github.repository == 'MChorfa/dagger-zig'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4.6.1
        with:
          name: sboms
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90

  # Verify provenance (demonstrates verification workflow)
  verify:
    name: Verify Provenance
    needs: [ build, provenance, sign ]
    # Skip if no provenance was generated
    if: |
      always() && 
      needs.build.outputs.hashes != '' &&
      needs.provenance.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.1.9
        with:
          name: build-artifacts
          path: artifacts/

      - name: Download provenance
        uses: actions/download-artifact@v4.1.9
        with:
          name: provenance
          path: provenance/

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.0

      - name: Verify SLSA provenance
        run: |
          slsa-verifier verify-artifact \
            --provenance-path provenance/*.intoto.jsonl \
            --source-uri github.com/${{ github.repository }} \
            --source-branch ${{ github.ref_name }} \
            artifacts/*
