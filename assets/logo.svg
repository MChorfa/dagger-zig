<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="daggerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBB03B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="zigGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4B4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="230" fill="#16213e" opacity="0.5"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#daggerGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Dagger Blade (centered) -->
  <g transform="translate(256, 200)" filter="url(#shadow)">
    <!-- Blade -->
    <path d="M -30 0 L 0 -120 L 30 0 Z" fill="url(#bladeGrad)" stroke="#A0A0A0" stroke-width="2"/>
    <!-- Fullers (grooves) -->
    <path d="M -8 -20 L 0 -100 L 8 -20" fill="none" stroke="#909090" stroke-width="2" opacity="0.5"/>
    <!-- Crossguard -->
    <rect x="-50" y="-5" width="100" height="15" rx="3" fill="#4A4A4A"/>
    <rect x="-45" y="-2" width="90" height="9" rx="2" fill="#606060"/>
    <!-- Hilt -->
    <rect x="-12" y="10" width="24" height="50" rx="2" fill="#8B4513"/>
    <!-- Pommel -->
    <circle cx="0" cy="70" r="15" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
    <circle cx="0" cy="70" r="8" fill="#FFA500"/>
  </g>

  <!-- Zig Zag Pattern (representing Zig language) - behind the dagger -->
  <g transform="translate(256, 340)" filter="url(#glow)">
    <path d="M -100 0 L -60 -40 L -20 0 L 20 -40 L 60 0 L 100 -40" 
          fill="none" 
          stroke="url(#zigGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Second zig zag for depth -->
    <path d="M -100 15 L -60 -25 L -20 15 L 20 -25 L 60 15 L 100 -25" 
          fill="none" 
          stroke="url(#zigGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.6"/>
  </g>

  <!-- Lightning bolts (energy) -->
  <g opacity="0.7">
    <path d="M 180 180 L 160 140 L 190 130" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 332 180 L 352 140 L 322 130" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Orbiting dots (representing containers/pods) -->
  <g>
    <circle cx="256" cy="60" r="8" fill="#FF6B35" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="180" r="6" fill="#F7931E" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="380" r="7" fill="#FBB03B" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="380" r="6" fill="#FF8C42" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="180" r="8" fill="#FF4B4B" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection lines between dots (representing network/CI/CD pipeline) -->
  <g stroke="#FF6B35" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 256 60 Q 338 120 420 180" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 420 180 Q 400 280 380 380" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 380 380 Q 256 420 132 380" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 380 Q 112 280 92 180" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 92 180 Q 174 120 256 60" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Text: dagger-zig -->
  <text x="256" y="460" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="42" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="2"
        filter="url(#shadow)">
    dagger-zig
  </text>

  <!-- Tagline -->
  <text x="256" y="485" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="400" 
        fill="#888888" 
        text-anchor="middle"
        letter-spacing="1">
    Enterprise Zig SDK for Dagger
  </text>

  <!-- Corner accents -->
  <g opacity="0.5">
    <path d="M 40 40 L 70 40 L 70 50 L 50 50 L 50 70 L 40 70 Z" fill="#FF6B35"/>
    <path d="M 472 40 L 442 40 L 442 50 L 462 50 L 462 70 L 472 70 Z" fill="#FF6B35"/>
    <path d="M 40 472 L 70 472 L 70 462 L 50 462 L 50 442 L 40 442 Z" fill="#FF6B35"/>
    <path d="M 472 472 L 442 472 L 442 462 L 462 462 L 462 442 L 472 442 Z" fill="#FF6B35"/>
  </g>

  <!-- Shield badge for SLSA L3 -->
  <g transform="translate(430, 430)" filter="url(#shadow)">
    <path d="M 0 -25 L 22 -15 L 22 10 Q 22 25 0 35 Q -22 25 -22 10 L -22 -15 Z" 
          fill="#1a1a2e" 
          stroke="#00C853" 
          stroke-width="2"/>
    <text x="0" y="5" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10" 
          font-weight="700" 
          fill="#00C853" 
          text-anchor="middle">
      SLSA
    </text>
    <text x="0" y="18" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="700" 
          fill="#FFFFFF" 
          text-anchor="middle">
      L3
    </text>
  </g>
</svg>
