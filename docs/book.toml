[book]
title = "dagger-zig Documentation"
authors = ["CKODEX Contributors"]
description = "A native Zig SDK for the Dagger programmable CI/CD engine"
language = "en"
src = "."

[build]
build-dir = "_site"
create-missing = false

[preprocessor.links]

[output.html]
git-repository-url = "https://github.com/MChorfa/dagger-zig"
edit-url-template = "https://github.com/MChorfa/dagger-zig/edit/main/docs/{path}"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
teaser-word-count = 30

[output.html.print]
enable = true

# Redirects disabled - can be added later if needed
# [output.html.redirect]
# "/getting-started.html" = "/getting-started/index.html"
