# Markdownlint configuration
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default state for all rules
default: true

# MD013/line-length - Allow long lines (URLs, technical terms can't be broken)
MD013: false

# MD024/no-duplicate-heading - Allow duplicate headings at different nesting levels
MD024:
  siblings_only: true

# MD033/no-inline-html - Allow inline HTML (needed for badges, etc.)
MD033: false

# MD034/no-bare-urls - Allow bare URLs (common in docs)
MD034: false

# MD040/fenced-code-language - Don't require language on code blocks
MD040: false

# MD041/first-line-heading - Don't require first line to be h1
MD041: false

# MD046/code-block-style - Don't enforce code block style
MD046: false

# MD049/emphasis-style - Don't enforce emphasis style
MD049: false

# MD050/strong-style - Don't enforce strong style
MD050: false

# MD060/table-column-style - Allow compact table style (common in GitHub markdown)
MD060: false

# MD022/blanks-around-headings - Allow compact headings in lists
MD022: false

# MD031/blanks-around-fences - Allow compact code blocks
MD031: false

# MD032/blanks-around-lists - Allow compact lists
MD032: false

# MD036/no-emphasis-as-heading - Allow emphasis as pseudo-headings
MD036: false

# MD058/blanks-around-tables - Allow tables in lists without blank lines
MD058: false
